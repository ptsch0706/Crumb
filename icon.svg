<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="1024" height="1024">
  <defs>
    <radialGradient id="boule-light" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fdf8f1"/>
      <stop offset="78%" stop-color="#e8c89a"/>
      <stop offset="100%" stop-color="#a87038"/>
    </radialGradient>
    <radialGradient id="boule-rim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="rgba(122, 60, 20, 0)"/>
      <stop offset="100%" stop-color="rgba(122, 60, 20, 0.5)"/>
    </radialGradient>
    <radialGradient id="boule-sheen" cx="40%" cy="28%" r="35%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.6)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
    <radialGradient id="bg-warm" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#d68a4f"/>
      <stop offset="100%" stop-color="#a35a22"/>
    </radialGradient>
    <filter id="boule-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" fill="url(#bg-warm)"/>

  <!-- Loaf body with rim shadow and drop shadow -->
  <g filter="url(#boule-shadow)">
    <circle cx="90" cy="92" r="58" fill="url(#boule-light)"/>
    <circle cx="90" cy="92" r="58" fill="url(#boule-rim)"/>
  </g>

  <!-- Wheat score: shadow layer -->
  <g stroke="#5c2c0d" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="90" y1="55" x2="90" y2="129"/>
    <line x1="78" y1="68" x2="90" y2="78"/>
    <line x1="102" y1="68" x2="90" y2="78"/>
    <line x1="78" y1="86" x2="90" y2="96"/>
    <line x1="102" y1="86" x2="90" y2="96"/>
    <line x1="78" y1="104" x2="90" y2="114"/>
    <line x1="102" y1="104" x2="90" y2="114"/>
  </g>

  <!-- Wheat score: highlight overlay (offset up-left for "lifted ear" effect) -->
  <g stroke="#fff5e0" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="88.5" y1="53.5" x2="88.5" y2="127.5"/>
    <line x1="76.5" y1="66.5" x2="88.5" y2="76.5"/>
    <line x1="100.5" y1="66.5" x2="88.5" y2="76.5"/>
    <line x1="76.5" y1="84.5" x2="88.5" y2="94.5"/>
    <line x1="100.5" y1="84.5" x2="88.5" y2="94.5"/>
    <line x1="76.5" y1="102.5" x2="88.5" y2="112.5"/>
    <line x1="100.5" y1="102.5" x2="88.5" y2="112.5"/>
  </g>

  <!-- Top sheen -->
  <circle cx="90" cy="92" r="58" fill="url(#boule-sheen)"/>
</svg>
